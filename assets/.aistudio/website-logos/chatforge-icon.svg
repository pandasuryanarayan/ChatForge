<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">ChatForge Logo</title>
  <desc id="desc">Blue chat bubble with an orange-red forge lightning spark.</desc>

  <defs>
    <linearGradient id="bubble" x1="22" y1="18" x2="138" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="spark" x1="55" y1="30" x2="112" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="48%" stop-color="#FF5A00"/>
      <stop offset="100%" stop-color="#EF3030"/>
    </linearGradient>

    <linearGradient id="edge" x1="35" y1="25" x2="125" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Chat bubble -->
  <path
    d="M48 15h58c22.644 0 41 18.356 41 41v29c0 22.644-18.356 41-41 41H79l-25 18v-18h-6c-22.644 0-41-18.356-41-41V56c0-22.644 18.356-41 41-41Z"
    fill="url(#bubble)"
    stroke="url(#edge)"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Bubble highlight -->
  <path
    d="M28 52c5-15 19-25 36-25h38c9 0 17 3 24 7-8-10-20-16-34-16H49c-10 0-19 4-26 10-2 2-3 5-4 8 3-2 6-3 9-4Z"
    fill="#FFFFFF"
    opacity=".18"
  />

  <!-- Forge lightning -->
  <path
    d="M91 21 52 78h26l-8 55 44-70H88Z"
    fill="url(#spark)"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Spark highlight -->
  <path
    d="m89 29-27 44h18l-4 25 29-47H85Z"
    fill="#FFFFFF"
    opacity=".16"
  />
</svg>