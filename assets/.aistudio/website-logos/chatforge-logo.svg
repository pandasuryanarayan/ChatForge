<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">ChatForge logo</title>
  <desc id="desc">A chat bubble containing a forge-style lightning spark, followed by the ChatForge wordmark.</desc>

  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(12 10)">
    <!-- speech bubble -->
    <path d="M56 8h60c27.6 0 50 22.4 50 50v25c0 27.6-22.4 50-50 50H82l-25 17v-17H56c-27.6 0-50-22.4-50-50V58C6 30.4 28.4 8 56 8Z"
          fill="url(#bubble)"/>
    <!-- subtle inner chat highlight -->
    <path d="M31 34c9-10 22-16 37-16h44c10 0 20 3 28 8-9-13-24-21-41-21H56c-18 0-33 7-42 19 5-2 11-3 17-3Z"
          fill="#fff" opacity=".14"/>

    <!-- forge spark / lightning -->
    <path d="M94 20 54 82h29l-8 38 43-62H90Z"
          fill="url(#spark)"
          stroke="#fff"
          stroke-width="5"
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="54" font-weight="750" letter-spacing="-2">
    <text x="190" y="91" fill="#0F172A">Chat</text>
    <text x="319" y="91" fill="#4F46E5">Forge</text>
  </g>
</svg>